server:
  port: 8050
  health_check_interval: 30s
  default_timeout: 120s
  branding:
    headers: true
    header_name: "Kronaxis Router"
    content_inject: false
    content_text: "\n\n---\n*Powered by [Kronaxis Router](https://kronaxis.co.uk)*"
    content_skip_json: true

backends:
  - name: chiasegpu-gpt-5-4-mini
    url: "https://api.vilao.ai"
    type: openai
    model_name: "gpt-5.4-mini"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, tools]
    max_concurrent: 8
    health_endpoint: "/v1/models"

  - name: chiasegpu-cx-gpt-5-4
    url: "https://api.vilao.ai"
    type: openai
    model_name: "cx/gpt-5.4"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, tools]
    max_concurrent: 6
    health_endpoint: "/v1/models"

  - name: chiasegpu-gpt-5-4
    url: "https://api.vilao.ai"
    type: openai
    model_name: "gpt-5.4"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, tools]
    max_concurrent: 6
    health_endpoint: "/v1/models"

  - name: chiasegpu-cx-gpt-5-5
    url: "https://api.vilao.ai"
    type: openai
    model_name: "cx/gpt-5.5"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, tools]
    max_concurrent: 4
    health_endpoint: "/v1/models"

  - name: chiasegpu-gpt-5-5
    url: "https://api.vilao.ai"
    type: openai
    model_name: "gpt-5.5"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, long_context, vision, tools]
    max_concurrent: 4
    health_endpoint: "/v1/models"

  - name: chiasegpu-gpt-5-5-high
    url: "https://api.vilao.ai"
    type: openai
    model_name: "gpt-5.5-high"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, long_context, tools]
    max_concurrent: 3
    health_endpoint: "/v1/models"

  - name: chiasegpu-gpt-5-5-xhigh
    url: "https://api.vilao.ai"
    type: openai
    model_name: "gpt-5.5-xhigh"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, long_context, tools]
    max_concurrent: 2
    health_endpoint: "/v1/models"

  - name: chiasegpu-gpt-5-3-codex
    url: "https://api.vilao.ai"
    type: openai
    model_name: "gpt-5.3-codex"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, tools, code]
    max_concurrent: 4
    health_endpoint: "/v1/models"

  - name: chiasegpu-gpt-5-3-codex-high
    url: "https://api.vilao.ai"
    type: openai
    model_name: "gpt-5.3-codex-high"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, tools, code]
    max_concurrent: 3
    health_endpoint: "/v1/models"

  - name: chiasegpu-gpt-5-3-codex-xhigh
    url: "https://api.vilao.ai"
    type: openai
    model_name: "gpt-5.3-codex-xhigh"
    api_keys: ["env:CHIASEGPU_API_KEY_1", "env:CHIASEGPU_API_KEY_2"]
    cost_input_1m: 0.0
    cost_output_1m: 0.0
    capabilities: [json_output, tools, code]
    max_concurrent: 2
    health_endpoint: "/v1/models"

rules:
  - name: vision
    priority: 180
    match:
      content_type: vision
    backends: [chiasegpu-gpt-5-5]
    required_capabilities: [vision]

  - name: coding
    priority: 160
    match:
      call_type: code
    backends: [chiasegpu-gpt-5-3-codex, chiasegpu-gpt-5-3-codex-high, chiasegpu-gpt-5-3-codex-xhigh]
    required_capabilities: [code]

  - name: interactive-fast
    priority: 140
    match:
      priority_level: interactive
    backends: [chiasegpu-gpt-5-5, chiasegpu-gpt-5-5-high, chiasegpu-gpt-5-5-xhigh]

  - name: light-work
    priority: 120
    match:
      tier: 2
    backends: [chiasegpu-gpt-5-5, chiasegpu-gpt-5-5-high, chiasegpu-gpt-5-5-xhigh]

  - name: heavy-reasoning
    priority: 110
    match:
      tier: 1
    backends: [chiasegpu-gpt-5-5, chiasegpu-cx-gpt-5-5, chiasegpu-gpt-5-5-high, chiasegpu-gpt-5-5-xhigh]

  - name: bulk-cheap
    priority: 100
    match:
      priority_level: bulk
    backends: [chiasegpu-gpt-5-5, chiasegpu-gpt-5-5-high, chiasegpu-gpt-5-5-xhigh]

defaults:
  fallback_chain: [chiasegpu-gpt-5-5, chiasegpu-gpt-5-5-high, chiasegpu-gpt-5-5-xhigh]
  default_timeout_ms: 120000

batching:
  enabled: false
  window_ms: 50
  max_batch_size: 8
  priority_bypass: [interactive]

budgets: {}
rate_limits: {}
tenant_rate_limits:
  default_rpm: 120
  default_burst: 20

graphify:
  enabled: false

semantic_cache:
  enabled: false
